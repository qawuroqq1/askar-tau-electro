<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — ASKAR TAU ELECTRO</title>
  <meta name="description" content="ASKAR TAU ELECTRO: проектирование, изготовление и монтаж металлоконструкций — каркасы зданий, фермы, балки, промышленные конструкции и изделия по чертежам заказчика.">
  <meta name="theme-color" content="#09274b">
  <meta property="og:title" content="ASKAR TAU ELECTRO">
  <meta property="og:description" content="Проектирование. Производство. Металлоконструкции.">
  <meta property="og:image" content="assets/brand/logo-original.jpg">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=14">
  <link rel="stylesheet" href="assets/css/effects.css?v=14">
</head>
<body data-page="contacts">
<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="media"><img data-img="shopLaser2" data-eager sizes="100vw" alt=""></div>
    <div class="container">
      <nav class="crumbs" aria-label="breadcrumb"><a href="index.html" data-i18n="nav.home"></a><span data-i18n="nav.contacts"></span></nav>
      <span class="eyebrow" data-i18n="ct.eyebrow"></span>
      <h1 data-i18n="ct.title"></h1>
      <p data-i18n="ct.lead"></p>
    </div>
  </section>

  <section class="section section--paper">
    <div class="container contact-grid">
      <div>
        <div class="quick-actions reveal" data-quick-actions></div>
        <div class="contact-cards">
          <div class="contact-card reveal">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span data-i18n="ct.phone"></span></div>
            <div class="contact-card__val" data-contact="phone"></div>
          </div>
          <div class="contact-card reveal reveal-d1">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span data-i18n="ct.email"></span></div>
            <div class="contact-card__val" data-contact="email"></div>
          </div>
          <div class="contact-card reveal">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5z"/></svg><span data-i18n="ct.whatsapp"></span></div>
            <div class="contact-card__val" data-contact="whatsapp"></div>
          </div>
          <div class="contact-card reveal reveal-d1">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><path d="m21 4-18 7 6 2 2 6 3-4 5 4z"/></svg><span data-i18n="ct.telegram"></span></div>
            <div class="contact-card__val" data-contact="telegram"></div>
          </div>
          <div class="contact-card reveal">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="ct.address"></span></div>
            <div class="contact-card__val" data-contact="address"></div>
          </div>
          <div class="contact-card reveal reveal-d1">
            <div class="contact-card__label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="ct.hours"></span></div>
            <div class="contact-card__val" data-contact="hours"></div>
          </div>
        </div>

        <div class="legal reveal">
          <span class="eyebrow" data-i18n="ct.legal"></span>
          <dl>
            <dt data-i18n="ct.legal.name"></dt><dd data-contact="legalName"></dd>
            <dt data-i18n="ct.legal.bin"></dt><dd data-contact="bin"></dd>
          </dl>
          <div class="social" data-social style="margin-top:20px"></div>
        </div>
      </div>

      <form class="form reveal reveal-d1" id="form" data-request-form novalidate>
        <h2 data-i18n="ct.form.title"></h2>
        <div class="form__row">
          <div class="field"><label for="f-name" data-i18n="ct.f.name"></label><input id="f-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="f-phone" data-i18n="ct.f.phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required placeholder="+7"></div>
        </div>
        <div class="field"><label for="f-email" data-i18n="ct.f.email"></label><input id="f-email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="f-type" data-i18n="ct.f.type"></label>
          <select id="f-type" name="type">
            <option value="" data-i18n="ct.f.opt0"></option>
            <option data-i18n="ct.f.opt1"></option><option data-i18n="ct.f.opt2"></option>
            <option data-i18n="ct.f.opt4"></option>
            <option data-i18n="ct.f.opt5"></option><option data-i18n="ct.f.opt6"></option>
            <option data-i18n="ct.f.opt7"></option><option data-i18n="ct.f.opt8"></option>
          </select>
        </div>
        <div class="field"><label for="f-msg" data-i18n="ct.f.msg"></label><textarea id="f-msg" name="message"></textarea></div>
        <button class="btn btn--primary" type="submit" data-i18n="cta.send"></button>
        <p class="form__agree" data-i18n="ct.f.agree"></p>
        <p class="form__msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div class="container">
      <div class="map reveal" data-map>
        <div><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <h3 data-i18n="ct.map"></h3><p data-i18n="ct.map.t"></p></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/config.js?v=14"></script>
<script src="assets/js/images.js?v=14"></script>
<script src="assets/js/i18n.js?v=14"></script>
<script src="assets/js/main.js?v=14"></script>
<script src="assets/js/effects.js?v=14"></script>
</body>
</html>
