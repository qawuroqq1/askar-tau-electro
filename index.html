<main>

          <div class="card__body"><span class="card__num">05</span><h3 class="card__title" data-i18n="dir.custom"></h3><p class="card__text" data-i18n="dir.custom.t"></p><span class="card__link" data-i18n="cta.more"></span></div>
        </a>
        <a href="services.html#montage" class="card reveal reveal-d2">

          <div class="media"><img data-img="welding" data-max="1600" data-sizes="(max-width:1080px) 100vw, 50vw" alt=""></div>

      </div>
      <div class="cycle">
        <div class="cycle__item reveal"><div class="cycle__num">01</div><h3 data-i18n="cycle.1"></h3><p data-i18n="cycle.1.t"></p></div>

        </div>
        <div>
          <p class="lead reveal reveal-d1" data-i18n="home.items.text"></p>
          <div class="rail-controls" style="margin-top:24px">
            <button class="rail-btn" type="button" data-rail="-1" aria-label="Назад">←</button>
            <button class="rail-btn" type="button" data-rail="1" aria-label="Вперёд">→</button>
          </div>
        </div>
      </div>
      <div class="rail" id="rail">
        <a class="rail__item" href="products.html#gates"><div class="media"><img data-img="pGateLaser" alt=""></div><h3 data-i18n="prod.gates"></h3><p data-i18n="prod.gates.t"></p></a>
        <a class="rail__item" href="products.html#stairs"><div class="media"><img data-img="pStairsYellow" alt=""></div><h3 data-i18n="prod.stairs"></h3><p data-i18n="prod.stairs.t"></p></a>
        <a class="rail__item" href="products.html#cabinets"><div class="media"><img data-img="cabControl" alt=""></div><h3 data-i18n="prod.cabinets"></h3><p data-i18n="prod.cabinets.t"></p></a>
        <a class="rail__item" href="products.html#canopies"><div class="media"><img data-img="pCanopyArch" alt=""></div><h3 data-i18n="prod.canopies"></h3><p data-i18n="prod.canopies.t"></p></a>

    </div>

        <p class="lead reveal reveal-d1" data-i18n="prod.g3.t"></p>

      </div>
      <div class="electro-feature__collage reveal reveal-d1">
        <div class="media"><img data-img="cabOpen4" data-sizes="(max-width:680px) 100vw, (max-width:1080px) 50vw, 33vw" alt=""></div>

        <div><span class="eyebrow" data-i18n="home.approach.eyebrow"></span><h2 class="h2 reveal" data-i18n="home.approach.title"></h2></div>
      </div>
      <div class="approach">
        <div class="approach__item reveal">
          <div class="approach__icon"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>

        </div>
        <div class="approach__item reveal reveal-d1">
          <div class="approach__icon"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/><circle cx="12" cy="12" r="3"/></svg></div>
          <h3 data-i18n="appr.2"></h3><p data-i18n="appr.2.t"></p>
        </div>

          <div class="approach__icon"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></div>

  <!-- ============ CTA ============ -->

        <span class="eyebrow" data-i18n="cta.contact"></span>

      </div>
      <div class="cta__actions reveal reveal-d2">
        <a href="contacts.html#form" class="btn btn--primary" data-i18n="cta.request"></a>

<footer id="site-footer"></footer>

<script>
  // Прокрутка ленты изделий кнопками
  document.querySelectorAll("[data-rail]").forEach(function (b) {
    b.addEventListener("click", function () {
      var r = document.getElementById("rail");
      r.scrollBy({ left: r.clientWidth * 0.8 * parseInt(b.dataset.rail, 10), behavior: "smooth" });
    });
  });
</script>
</body>
